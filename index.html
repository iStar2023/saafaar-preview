    <script>
      // Discover the initial hero before the React bundle, on the homepage only.
      (() => {
        const base = '/';
        if (location.pathname.replace(/\/$/, '') !== base.replace(/\/$/, '')) return;
        const image = document.createElement('link');
        image.rel = 'preload';
        image.as = 'image';
        image.href = `${base}images/hero.webp`;
        image.imageSrcset = `${base}images/hero-sm.webp 800w, ${base}images/hero.webp 1920w`;
        image.imageSizes = '100vw';
        image.fetchPriority = 'high';
        document.head.append(image);
      })();
    </script>
